<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d6efd">
    
    <!-- SEO Tags -->
    <title>لعبة مطابقة الأرقام | تحدى عقلك بالرياضيات</title>
    <meta name="description" content="لعبة تعليمية ممتعة لحل المعادلات الرياضية البسيطة. تجاوز 10 مراحل واجمع 100 نقطة لتفوز باللعبة.">
    <meta name="keywords" content="لعبة رياضيات, مطابقة الأرقام, تعليم أطفال, العاب ذكاء, معادلات رياضية, HTML5 Game">
    <meta name="author" content="Haytham Zeidan">
    
    <!-- Social Media / Open Graph SEO -->
    <meta property="og:title" content="لعبة مطابقة الأرقام | تحدى عقلك">
    <meta property="og:description" content="تجاوز 10 مراحل رياضية ممتعة واجمع 100 نقطة. العب الآن!">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon512.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fw-bold fs-5"><i class="fa-solid fa-calculator me-2"></i> مطابقة الأرقام</span>
            <div class="text-white">
                <span id="score-display" class="badge bg-warning text-dark fs-6 px-3 py-1 rounded-pill shadow-sm">النقاط: 0</span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-auto py-2 text-center flex-grow-1 d-flex flex-column justify-content-center" style="max-width: 650px; overflow: hidden;">
        
        <!-- Levels Screen -->
        <div id="levels-screen" class="w-100">
            <h3 class="mb-3 fw-bold text-dark fs-4">اختر المرحلة</h3>
            <div class="d-flex flex-wrap justify-content-center gap-2" id="levels-container">
                <!-- Levels injected via JS -->
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="w-100">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="showLevelsScreen()"><i class="fa-solid fa-arrow-right ms-1"></i> المراحل</button>
                <h4 class="text-primary fw-bold m-0 fs-5">المرحلة <span id="current-level-display"></span></h4>
                <span class="text-muted small">طابق المعادلة بالناتج</span>
            </div>
            
            <div class="row g-2 mt-1">
                <div class="col-6">
                    <h6 class="mb-2 text-secondary fw-bold">المعادلات</h6>
                    <div id="equations-container" class="d-flex flex-column gap-2"></div>
                </div>
                <div class="col-6">
                    <h6 class="mb-2 text-secondary fw-bold">النواتج</h6>
                    <div id="answers-container" class="d-flex flex-column gap-2"></div>
                </div>
            </div>
        </div>

        <!-- Final Win Screen -->
        <div id="win-screen" class="py-3 w-100">
            <h1 class="display-4 text-success mb-2"><i class="fa-solid fa-trophy animate-bounce"></i></h1>
            <h2 class="text-success fw-bold mb-2 fs-3">ألف مبروك! لقد فزت باللعبة!</h2>
            <p class="lead text-muted fs-6 mb-3">لقد أتممت جميع المراحل بنجاح وجمعت 100 نقطة باقتدار.</p>
            <button class="btn btn-primary rounded-pill px-4 py-2 shadow" onclick="resetGame()"><i class="fa-solid fa-rotate-right ms-2"></i> العب من جديد</button>
        </div>

    </main>

    <!-- Footer & Buttons -->
    <footer class="bg-dark text-white text-center py-2 mt-auto shadow-lg">
        <div class="container">
            <div class="mb-2 d-flex justify-content-center gap-2">
                <button class="btn btn-light btn-sm rounded-pill px-3 fw-bold shadow-sm" onclick="shareGame()">
                    <i class="fa-solid fa-share-nodes text-primary ms-1"></i> مشاركة اللعبة
                </button>
                <button id="install-btn" class="btn btn-success btn-sm rounded-pill px-3 fw-bold shadow-sm" style="display: none;">
                    <i class="fa-solid fa-download ms-1"></i> تثبيت اللعبة
                </button>
            </div>
            <div class="footer-credits">
                <p class="mb-0 text-light small">تطوير وتصميم: <a href="https://github.com/wazefapress" target="_blank" class="text-info text-decoration-none fw-bold">هيثم  زيدان</a> | <a href="https://github.com/wazefapress/Number-Matching-Math-Game" target="_blank" class="text-light text-opacity-75 text-decoration-none"><i class="fa-brands fa-github ms-1"></i> Github</a></p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap, SweetAlert2 & Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Game Engine & Audio Logic -->
    <script src="game.js"></script>
</body>
</html>
