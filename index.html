<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d6efd">
    
    <!-- SEO Tags -->
    <title>لعبة مطابقة الأرقام | تحدى عقلك بالرياضيات</title>
    <meta name="description" content="لعبة تعليمية ممتعة لحل المعادلات الرياضية البسيطة. تجاوز 10 مراحل واجمع 100 نقطة لتفوز باللعبة.">
    <meta name="keywords" content="لعبة رياضيات, مطابقة الأرقام, تعليم أطفال, العاب ذكاء, معادلات رياضية, HTML5 Game">
    <meta name="author" content="Haytham Zeidan">
    
    <!-- Social Media / Open Graph SEO -->
    <meta property="og:title" content="لعبة مطابقة الأرقام | تحدى عقلك">
    <meta property="og:description" content="تجاوز 10 مراحل رياضية ممتعة واجمع 100 نقطة. العب الآن!">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon512.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="style.css">
  
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand mb-0 h1 fw-bold"><i class="fa-solid fa-calculator me-2"></i> مطابقة الأرقام</span>
            <div class="text-white">
                <span id="score-display" class="badge bg-warning text-dark fs-6 px-3 py-2 rounded-pill shadow-sm">النقاط: 0</span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5 text-center flex-grow-1" style="max-width: 700px;">
        
        <!-- Levels Screen -->
        <div id="levels-screen">
            <h2 class="mb-4 fw-bold text-dark">اختر المرحلة</h2>
            <div class="d-flex flex-wrap justify-content-center" id="levels-container">
                <!-- Levels injected via JS -->
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="showLevelsScreen()"><i class="fa-solid fa-arrow-right ms-1"></i> المراحل</button>
                <h3 class="text-primary fw-bold m-0">المرحلة <span id="current-level-display"></span></h3>
                <span class="text-muted small">طابق المعادلة بالناتج</span>
            </div>
            
            <div class="row g-4 mt-2">
                <div class="col-6">
                    <h5 class="mb-3 text-secondary fw-bold">المعادلات</h5>
                    <div id="equations-container" class="d-flex flex-column gap-3"></div>
                </div>
                <div class="col-6">
                    <h5 class="mb-3 text-secondary fw-bold">النواتج</h5>
                    <div id="answers-container" class="d-flex flex-column gap-3"></div>
                </div>
            </div>
        </div>

        <!-- Final Win Screen -->
        <div id="win-screen" class="py-5">
            <h1 class="display-3 text-success mb-3"><i class="fa-solid fa-trophy animate-bounce"></i></h1>
            <h1 class="text-success fw-bold mb-3">ألف مبروك! لقد فزت باللعبة!</h1>
            <p class="lead text-muted">لقد أتممت جميع المراحل بنجاح وجمعت 100 نقطة باقتدار.</p>
            <button class="btn btn-primary btn-lg rounded-pill px-5 mt-3 shadow" onclick="resetGame()"><i class="fa-solid fa-rotate-right ms-2"></i> العب من جديد</button>
        </div>

    </div>

    <!-- Footer & Buttons -->
    <footer class="bg-dark text-white text-center py-4 mt-auto shadow-lg">
        <div class="container">
            <div class="mb-3 d-flex justify-content-center gap-3">
                <button class="btn btn-light rounded-pill px-4 fw-bold shadow-sm" onclick="shareGame()">
                    <i class="fa-solid fa-share-nodes text-primary ms-1"></i> مشاركة اللعبة
                </button>
                <button id="install-btn" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm" style="display: none;">
                    <i class="fa-solid fa-download ms-1"></i> تثبيت اللعبة
                </button>
            </div>
            <div class="footer-credits mt-3">
                <p class="mb-1 text-light">تطوير وتصميم: <a href="https://github.com/wazefapress" target="_blank" class="text-info text-decoration-none fw-bold">هيثم  زيدان</a></p>
                <p class="mb-0"><a href="https://github.com/wazefapress/Number-Matching-Math-Game" target="_blank" class="text-light text-opacity-75 text-decoration-none small"><i class="fa-brands fa-github ms-1"></i>  اللعبة على Github</a></p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap, SweetAlert2 & Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Game Engine & Audio Logic -->
   <script src="game.js"></script>
</body>
</html>
